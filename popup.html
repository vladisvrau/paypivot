<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PayPivot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>PayPivot</h1>

  <section class="toolbar">
    <button id="flip" type="button" title="Swap rows and columns">Flip table</button>
    <label class="check" title="Show amounts in other currencies">
      <input id="convert" type="checkbox" role="switch"> Convert
    </label>
    <button id="refresh" type="button" title="Fetch the latest rates" aria-label="Fetch the latest rates">↻</button>
  </section>

  <section class="grid" id="grid"></section>

  <p id="rateInfo" data-key="rate-info"></p>

  <section class="settings" data-key="settings">
    <label>Hours / week
      <input id="hoursPerWeek" type="number" min="1" max="168" step="0.5">
    </label>
    <label>Days / week
      <input id="daysPerWeek" type="number" min="1" max="7" step="0.5">
    </label>
    <label>Weeks / year
      <input id="weeksPerYear" type="number" min="1" max="52" step="1">
    </label>
  </section>

  <script src="popup.js"></script>
</body>
</html>
