<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PayPivot store screenshot stage</title>
<!--
  Renders a 1280x800 store screenshot of the real popup (and, for shot 5, the real page helper).
  Open stage.html?shot=1 (2 to 5) from a local server at the repository root. Each shot seeds the
  popup's storage (localStorage outside the extension) with fictional data before loading it.
-->
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    background: #F1EFE8; color: #2C2C2A;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { margin: 44px 0 6px; font-size: 44px; font-weight: 600; letter-spacing: -0.5px; }
  p.sub { margin: 0 0 28px; font-size: 21px; color: #5F5E5A; }
  .stage { display: flex; align-items: center; justify-content: center; gap: 56px; }
  .frame {
    background: #fff; border-radius: 14px; overflow: hidden; flex: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 18px 50px rgba(0,0,0,.16);
  }
  iframe { border: 0; display: block; transform-origin: 0 0; color-scheme: light; }

  /* Shot 2: a job post with the figure selected and the right-click menu open. */
  .post {
    width: 470px; background: #fff; border-radius: 14px; padding: 30px 32px 34px; position: relative;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 18px 50px rgba(0,0,0,.12);
    font-size: 17px; line-height: 1.55; color: #3d3d3a;
  }
  .post h2 { margin: 0 0 4px; font-size: 25px; color: #2C2C2A; }
  .post .meta { margin: 0 0 18px; color: #6b6a66; font-size: 16px; }
  .post p { margin: 0 0 14px; }
  .post mark { background: #b9d3ff; color: inherit; padding: 1px 0; }
  .menu {
    position: absolute; left: 150px; top: 238px; width: 400px; white-space: nowrap; background: #fff; border-radius: 8px;
    padding: 6px 0; font-size: 15px; color: #222;
    box-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 10px 30px rgba(0,0,0,.2);
  }
  .menu div { padding: 7px 16px; display: flex; align-items: center; gap: 10px; }
  .menu .sep { height: 1px; background: #e4e4e4; margin: 5px 0; padding: 0; }
  .menu .hot { background: #e8effd; }
  .menu img { width: 16px; height: 16px; }
  .menu .muted { color: #555; padding-left: 42px; }

  /* Shot 5: a browser window around the sample application form. */
  .browser { border-radius: 12px; }
  .bar {
    height: 40px; background: #e9e7e1; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #cfccc4; }
  .bar span {
    margin-left: 14px; flex: 1; background: #fff; border-radius: 6px; height: 24px; line-height: 24px;
    padding: 0 12px; font-size: 13px; color: #6b6a66;
  }
</style>
<script src="../shared/parse.js"></script>
</head>
<body>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="stage" id="stage"></div>
<script>
// ---------- fictional data ----------
const calculator = {
  codes: ['USD', 'EUR', 'BRL'], convert: true, transposed: false, collapsed: false,
  pinned: ['hour', 'month', 'year'], hoursPerWeek: 40, daysPerWeek: 5, weeksPerYear: 52,
  anchor: { period: 'hour', cur: 'USD', text: '50' },
  rates: {}, manual: {}, ratesBase: '', rateDate: '', ratesFetchedAt: 0, names: null,
};
const profile = {
  firstName: 'Sam', lastName: 'Rivera', email: 'sam.rivera@example.com', phone: '+351 912 345 678',
  city: 'Lisbon', country: 'Portugal',
  linkedin: 'https://linkedin.com/in/samrivera', github: 'https://github.com/samrivera',
  website: 'https://samrivera.dev',
  title: 'Senior Frontend Engineer', company: 'Brightline', experience: '8',
  workAuth: 'EU citizen, no sponsorship needed', notice: '30 days', salary: '€75,000 a year',
};
const snippets = [
  { id: 's1', title: 'Short bio', body: 'Frontend engineer with eight years of experience building accessible, fast web apps, most recently leading the design system team at Brightline.' },
  { id: 's2', title: 'Why I’m looking', body: 'I’m looking for a product-focused team where I can work closely with design and own features end to end.' },
];
const files = {
  items: [
    { id: 'f1', label: 'Résumé — English', name: 'sam-rivera-resume.pdf', type: 'application/pdf', size: 184320, addedAt: Date.parse('2026-11-02') },
    { id: 'f2', label: 'CV — Português', name: 'sam-rivera-cv-pt.pdf', type: 'application/pdf', size: 179200, addedAt: Date.parse('2026-11-02') },
  ],
  defaultId: 'f1',
};

// ---------- shots ----------
const shots = {
  1: {
    title: 'One pay figure, every pay period',
    sub: 'Type an hourly rate, a monthly salary or a yearly package. The rest fills in.',
    calculator: {},
    ui: { tab: 'pay', open: {} },
  },
  2: {
    title: 'Straight from the job post',
    sub: 'Select a salary on any page, right-click, and PayPivot reads the amount, currency and period.',
    calculator: { codes: ['EUR', 'USD'], collapsed: true, anchor: { period: 'hour', cur: 'EUR', text: '40' } },
    ui: { tab: 'pay', open: {} },
    pending: '$120k – $150k a year',
    box: { w: 560, h: 560, scale: 1.25 },
  },
  3: {
    title: 'See what an offer is really worth',
    sub: 'Add bonus, equity, benefits and time off for the yearly total and an effective hourly rate.',
    calculator: {
      codes: ['USD', 'EUR'], collapsed: true, anchor: { period: 'year', cur: 'USD', text: '135,000' },
      comp: { cur: 'USD', bonus: '10', bonusType: 'percent', equity: '80,000', vest: 4, signon: '15,000', signonYears: 1, benefits: '9,000', pto: '25', costs: '3,000' },
    },
    ui: { tab: 'pay', open: { comp: true } },
    scrollTo: 'comp',
  },
  4: {
    title: 'Your details, one click away',
    sub: 'Pin the profile fields you use most. Reusable answers and résumés are a click further.',
    helperOn: true,
    ui: { tab: 'apply', open: { profileGroup: true }, profile: { pinned: ['email', 'phone', 'linkedin', 'github', 'website'], collapsed: true } },
  },
  5: {
    title: 'Fill application forms in a click',
    sub: 'Optional: PayPivot recognises the fields and fills them from your profile. You stay in control.',
    form: true,
  },
};

const shot = shots[new URLSearchParams(location.search).get('shot')] || shots[1];
document.getElementById('title').textContent = shot.title;
document.getElementById('sub').textContent = shot.sub;
const stage = document.getElementById('stage');

localStorage.clear();
const put = (key, value) => localStorage.setItem(key, JSON.stringify(value));
put('state2', { ...calculator, ...shot.calculator });
put('profile', profile);
put('snippets', snippets);
put('files', files);
if (shot.ui) put('ui', shot.ui);
if (shot.pending) put('pending', { text: shot.pending, result: PayPivot.parseSalary(shot.pending, 'en-US'), at: Date.now() });

if (shot.pending) {
  stage.insertAdjacentHTML('beforeend', `
    <div class="post">
      <h2>Senior Frontend Engineer</h2>
      <p class="meta">Remote (United States) · Full time</p>
      <p>You’ll lead the build of our customer dashboard, working closely with design and product.</p>
      <p><strong>Compensation:</strong> <mark>${shot.pending}</mark>, plus equity and a yearly learning budget.</p>
      <p>We review every application within a week.</p>
      <div class="menu">
        <div class="muted">Copy</div>
        <div class="muted">Search Google for “${shot.pending}”</div>
        <div class="sep"></div>
        <div class="hot"><img src="../icons/icon16.png" alt="">Convert “${shot.pending}” with PayPivot</div>
        <div class="sep"></div>
        <div class="muted">Inspect</div>
      </div>
    </div>`);
}

if (shot.form) {
  stage.insertAdjacentHTML('beforeend', `
    <div class="frame browser">
      <div class="bar"><i></i><i></i><i></i><span>careers.example.com/jobs/frontend-engineer/apply</span></div>
      <iframe id="form" src="job-form.html" width="1100" height="590"></iframe>
    </div>`);
} else {
  stage.insertAdjacentHTML('beforeend', '<div class="frame"><iframe id="popup" src="../popup.html"></iframe></div>');
  const popup = document.getElementById('popup');
  const frame = popup.parentElement;
  const box = shot.box || { w: 1160, h: 570, scale: 1.7 };
  let scrolled = false;
  const fit = () => {
    const doc = popup.contentDocument;
    const body = doc && doc.body;
    if (!body || !body.offsetWidth) return;
    if (shot.scrollTo && !scrolled && doc.getElementById(shot.scrollTo)) {
      const target = doc.getElementById(shot.scrollTo);
      body.scrollTop = target.offsetTop - 70;
      scrolled = body.scrollTop > 0;
    }
    if (shot.helperOn && doc.getElementById('helperHint')) {
      // Outside the extension the switch is disabled; show it as the extension does when it is on.
      const toggle = doc.getElementById('helperToggle');
      toggle.style.transition = 'none'; // headless screenshots can catch it mid-slide
      toggle.disabled = false;
      toggle.checked = true;
      doc.getElementById('helperHint').textContent =
        'On. Application forms show PayPivot buttons on fields it can fill. Reload pages that were already open.';
    }
    const w = body.offsetWidth, h = body.offsetHeight;
    const scale = Math.min(box.scale, box.w / w, box.h / h);
    popup.width = w; popup.height = h;
    popup.style.transform = `scale(${scale})`;
    frame.style.width = `${w * scale}px`;
    frame.style.height = `${h * scale}px`;
  };
  setInterval(fit, 100);
}
</script>
</body>
</html>
