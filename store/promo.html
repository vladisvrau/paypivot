<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PayPivot promo tile</title>
<!-- Renders the 440x280 small promo tile for the Chrome Web Store. -->
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: #F1EFE8; color: #2C2C2A;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  img { width: 96px; height: 96px; }
  h1 { margin: 16px 0 2px; font-size: 34px; font-weight: 600; letter-spacing: -0.5px; }
  p { margin: 0; font-size: 16px; color: #5F5E5A; }
</style>
</head>
<body>
  <img src="../icons/icon.svg" alt="">
  <h1>PayPivot</h1>
  <p>Salary converter &amp; job application helper</p>
</body>
</html>
